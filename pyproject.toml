[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marketing-platform"
version = "0.1.0"
description = "AI Marketing Intelligence Platform - Competitive intelligence and content automation for marketers"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # Celery
    "celery[redis]>=5.4.0",

    # Telegram bot
    "aiogram>=3.14.0",

    # Stripe
    "stripe>=11.3.0",

    # AI / LLM
    "anthropic>=0.40.0",
    "openai>=1.58.0",

    # Vector DB
    "qdrant-client>=1.12.0",

    # HTTP
    "httpx>=0.28.0",

    # Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",

    # Media
    "elevenlabs>=1.14.0",

    # S3
    "boto3>=1.35.0",

    # Utilities
    "python-multipart>=0.0.17",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "bot/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
