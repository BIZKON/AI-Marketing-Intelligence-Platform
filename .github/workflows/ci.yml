name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install linter
        run: pip install ruff

      - name: Ruff check
        run: ruff check backend/ bot/

      - name: Ruff format check
        run: ruff format --check backend/ bot/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: marketing_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings "pydantic[email]"
          pip install "sqlalchemy[asyncio]" asyncpg alembic greenlet
          pip install "redis[hiredis]" "celery[redis]"
          pip install aiogram stripe anthropic openai httpx websockets
          pip install beautifulsoup4 lxml elevenlabs boto3
          pip install python-multipart "python-jose[cryptography]" "passlib[bcrypt]"
          pip install tenacity cachetools
          pip install pytest pytest-asyncio pytest-cov

      - name: Run backend tests
        env:
          PYTHONPATH: backend:.
          SECRET_KEY: ci-test-secret-key-that-is-at-least-32-characters-long
          DATABASE_URL: postgresql+asyncpg://platform:platform@localhost:5432/marketing_platform_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ATLAS_CLOUD_API_KEY: ""
          ATLAS_CLOUD_BASE_URL: https://api.atlascloud.ai/api/v1
        run: >
          pytest backend/tests/ bot/tests/
          -v
          --tb=short
          --cov=backend/app
          --cov=bot
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-security-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip install fastapi uvicorn pydantic pydantic-settings \
            "sqlalchemy[asyncio]" asyncpg alembic greenlet \
            "redis[hiredis]" "celery[redis]" aiogram stripe \
            anthropic openai httpx beautifulsoup4 lxml elevenlabs boto3 \
            python-multipart "python-jose[cryptography]" "passlib[bcrypt]" \
            tenacity cachetools
          pip-audit --strict --desc 2>&1 || true

      - name: Check for secrets in code
        run: |
          # Fail if any hardcoded secrets patterns are found
          ! grep -rn "change-me-in-production\|sk_live_\|sk_test_" \
            --include="*.py" --include="*.ts" --include="*.tsx" \
            backend/ bot/ frontend/src/ || true

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/Dockerfile.backend -t marketing-backend .

      - name: Build bot image
        run: docker build -f infra/docker/Dockerfile.bot -t marketing-bot .

      - name: Build frontend image
        run: docker build -f infra/docker/Dockerfile.frontend -t marketing-frontend .
