# Nginx reverse proxy for AI API access (Beget VPS)
# Proxies Anthropic, OpenAI, and ElevenLabs APIs
# Install: apt install nginx certbot python3-certbot-nginx
# SSL: certbot --nginx -d proxy.alchemya-trainer.ru

upstream anthropic_api {
    server api.anthropic.com:443;
}

upstream openai_api {
    server api.openai.com:443;
}

upstream elevenlabs_api {
    server api.elevenlabs.io:443;
}

server {
    listen 80;
    server_name proxy.alchemya-trainer.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proxy.alchemya-trainer.ru;

    # SSL — managed by Certbot
    ssl_certificate /etc/letsencrypt/live/proxy.alchemya-trainer.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.alchemya-trainer.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

    # Anthropic API
    location /anthropic/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass https://api.anthropic.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.anthropic.com;
        proxy_set_header Host api.anthropic.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # OpenAI API (REST)
    location /openai/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass https://api.openai.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;
        proxy_set_header Host api.openai.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # OpenAI Realtime API (WebSocket for voice mode)
    location /realtime {
        proxy_pass https://api.openai.com/v1/realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host api.openai.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ElevenLabs API
    location /elevenlabs/ {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass https://api.elevenlabs.io/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.elevenlabs.io;
        proxy_set_header Host api.elevenlabs.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # D-ID API
    location /d-id/ {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass https://api.d-id.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.d-id.com;
        proxy_set_header Host api.d-id.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # Health check
    location /health {
        return 200 '{"status":"ok","proxy":"alchemya"}';
        add_header Content-Type application/json;
    }
}
